<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Chit Response Scanner</title>
    <!-- Lightweight Styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <!-- Tesseract OCR Engine for Client-Side Recognition -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
    <style>
        body { max-width: 900px; margin: 15px auto; padding: 0 10px; }
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-buttons button { flex: 1; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: rgba(0,0,0,0.02); }
        .scanner-container { text-align: center; position: relative; }
        video { width: 100%; max-width: 450px; border-radius: 8px; background: #000; }
        canvas { display: none; }
        .crop-box {
            position: absolute; top: 30%; left: 25%; width: 50%; height: 35%;
            border: 3px dashed #ff9800; border-radius: 8px; pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
        }
        .status-box { font-weight: bold; font-size: 1.1em; margin: 10px 0; color: #0275d8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; font-size: 0.85em; }
        .badge-success { background-color: #2e7d32; }
        .badge-danger { background-color: #c62828; }
        .badge-neutral { background-color: #616161; }
    </style>
</head>
<body>

    <h2>Handwritten Paper Response Scanner</h2>

    <div class="tab-buttons">
        <button onclick="showTab('setup-tab')">1. MCQ & Roster Setup</button>
        <button onclick="showTab('scanner-tab')">2. Live OCR Scanner</button>
        <button onclick="showTab('results-tab')">3. Results & Export</button>
    </div>

    <!-- TAB 1: SETUP -->
    <div id="setup-tab" class="tab-content active">
        <div class="card">
            <h3>Configure Multiple Choice Question</h3>
            <label for="q-prompt">Question Prompt:</label>
            <input type="text" id="q-prompt" placeholder="e.g., What is the capital of France?" style="width: 100%;">

            <h4>Options & Correct Answer:</h4>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                <input type="radio" name="correct-ans" value="A" checked> <strong>A:</strong>
                <input type="text" id="opt-A" placeholder="Option A text" style="flex:1;">
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                <input type="radio" name="correct-ans" value="B"> <strong>B:</strong>
                <input type="text" id="opt-B" placeholder="Option B text" style="flex:1;">
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                <input type="radio" name="correct-ans" value="C"> <strong>C:</strong>
                <input type="text" id="opt-C" placeholder="Option C text" style="flex:1;">
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                <input type="radio" name="correct-ans" value="D"> <strong>D:</strong>
                <input type="text" id="opt-D" placeholder="Option D text" style="flex:1;">
            </div>
        </div>

        <div class="card">
            <h3>Class Student Roster</h3>
            <label for="roster-input">Enter Student Names or Roll Numbers (One per line):</label>
            <textarea id="roster-input" rows="8" style="width:100%; font-family:monospace;" placeholder="Student 01&#10;Student 02&#10;Student 03"></textarea>
            <button onclick="saveSetup()" style="background:#0275d8; color:white; width:100%;">Save Setup & Proceed</button>
        </div>
    </div>

    <!-- TAB 2: LIVE CAMERA SCANNER -->
    <div id="scanner-tab" class="tab-content">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Scanning Target</h3>
                <span id="scan-progress" style="font-weight:bold;">0 / 0 Scanned</span>
            </div>

            <label for="student-select">Active Student:</label>
            <select id="student-select" style="font-size:1.1em; padding:6px; width:100%;"></select>

            <div class="scanner-container" style="margin-top:15px;">
                <div style="position:relative; display:inline-block; width:100%; max-width:450px;">
                    <video id="video" playsinline></video>
                    <div class="crop-box"></div>
                </div>
                <canvas id="canvas"></canvas>

                <div class="status-box" id="ocr-status">Camera Inactive</div>

                <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
                    <button id="start-btn" onclick="startCamera()" style="background:#2e7d32; color:white;">Start Camera</button>
                    <button id="snap-btn" onclick="captureAndOCR()" style="background:#ff9800; color:white;" disabled>Scan Paper Chit</button>
                    <button id="stop-btn" onclick="stopCamera()" style="background:#c62828; color:white;" disabled>Stop Camera</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 3: RESULTS & EXPORT -->
    <div id="results-tab" class="tab-content">
        <div class="card">
            <h3>Scanned Results Table</h3>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button onclick="exportCSV()" style="background:#2e7d32; color:white;">Download CSV File</button>
                <button onclick="clearResults()" style="background:#c62828; color:white;">Clear Scanned Responses</button>
            </div>

            <div id="summary-stats" style="font-weight:bold; margin-bottom:10px;"></div>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student Name</th>
                        <th>Scanned Choice</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="results-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let roster = [];
        let responses = {};
        let videoStream = null;
        let worker = null;

        // Initialize Tesseract Worker for fast offline OCR
        async function initOCR() {
            document.getElementById('ocr-status').innerText = 'Initializing OCR Engine...';
            worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDabcd' // Only recognize letters A, B, C, D
            });
            document.getElementById('ocr-status').innerText = 'Camera Inactive (OCR Ready)';
        }
        initOCR();

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (tabId === 'scanner-tab') updateScannerUI();
            if (tabId === 'results-tab') renderResultsTable();
            if (tabId !== 'scanner-tab' && videoStream) stopCamera();
        }

        function saveSetup() {
            const rawRoster = document.getElementById('roster-input').value.trim();
            if (!rawRoster) {
                alert('Please enter at least one student name/number.');
                return;
            }
            roster = rawRoster.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            alert(`Setup saved successfully! Total students loaded: ${roster.length}`);
            showTab('scanner-tab');
        }

        function updateScannerUI() {
            const select = document.getElementById('student-select');
            select.innerHTML = '';
            
            if (roster.length === 0) {
                // Populate default roster if none entered
                for (let i = 1; i <= 40; i++) roster.push(`Student ${i < 10 ? '0' + i : i}`);
                document.getElementById('roster-input').value = roster.join('\n');
            }

            roster.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = `${name} ${responses[name] ? ' (Done: ' + responses[name] + ')' : ''}`;
                select.appendChild(opt);
            });

            document.getElementById('scan-progress').innerText = `${Object.keys(responses).length} / ${roster.length} Scanned`;
        }

        async function startCamera() {
            const video = document.getElementById('video');
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = videoStream;
                video.play();
                document.getElementById('start-btn').disabled = true;
                document.getElementById('snap-btn').disabled = false;
                document.getElementById('stop-btn').disabled = false;
                document.getElementById('ocr-status').innerText = 'Camera active. Frame chit inside orange box & tap "Scan Paper Chit".';
            } catch (err) {
                alert('Unable to access mobile camera: ' + err.message);
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            document.getElementById('start-btn').disabled = false;
            document.getElementById('snap-btn').disabled = true;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('ocr-status').innerText = 'Camera Stopped.';
        }

        async function captureAndOCR() {
            if (!worker) {
                alert('OCR Engine is still loading. Please wait a moment.');
                return;
            }

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Crop the specific center area defined by the orange box
            const cropX = canvas.width * 0.25;
            const cropY = canvas.height * 0.30;
            const cropWidth = canvas.width * 0.50;
            const cropHeight = canvas.height * 0.35;

            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = cropWidth;
            croppedCanvas.height = cropHeight;
            const cropCtx = croppedCanvas.getContext('2d');
            cropCtx.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            document.getElementById('ocr-status').innerText = 'Processing image...';

            // Perform OCR on cropped area
            const result = await worker.recognize(croppedCanvas);
            const detectedText = result.data.text.replace(/[^ABCDabcd]/g, '').toUpperCase();

            const currentStudent = document.getElementById('student-select').value;

            if (detectedText.length > 0) {
                const char = detectedText[0]; // Take primary letter detected
                responses[currentStudent] = char;
                document.getElementById('ocr-status').innerText = `Success! Recorded '${char}' for ${currentStudent}`;
                
                // Auto-advance to next student
                const select = document.getElementById('student-select');
                if (select.selectedIndex < select.options.length - 1) {
                    select.selectedIndex += 1;
                }
                updateScannerUI();
            } else {
                document.getElementById('ocr-status').innerText = 'Recognition failed. Ensure letter (A, B, C, or D) is written clearly inside box.';
            }
        }

        function renderResultsTable() {
            const tbody = document.getElementById('results-table-body');
            tbody.innerHTML = '';

            const correctAns = document.querySelector('input[name="correct-ans"]:checked').value;
            let correctCount = 0;
            let totalScanned = Object.keys(responses).length;

            roster.forEach((name, index) => {
                const choice = responses[name] || 'Not Scanned';
                let statusHtml = '<span class="badge badge-neutral">Pending</span>';

                if (choice !== 'Not Scanned') {
                    if (choice === correctAns) {
                        statusHtml = '<span class="badge badge-success">Correct</span>';
                        correctCount++;
                    } else {
                        statusHtml = '<span class="badge badge-danger">Incorrect</span>';
                    }
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${name}</td>
                    <td><strong>${choice}</strong></td>
                    <td>${statusHtml}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('summary-stats').innerText = 
                `Total Students: ${roster.length} | Scanned: ${totalScanned} | Correct Responses: ${correctCount} | Correct Answer Key: ${correctAns}`;
        }

        function clearResults() {
            if (confirm('Clear all recorded student answers?')) {
                responses = {};
                updateScannerUI();
                renderResultsTable();
            }
        }

        function exportCSV() {
            const qPrompt = document.getElementById('q-prompt').value || 'MCQ_Question';
            const correctAns = document.querySelector('input[name="correct-ans"]:checked').value;

            let csv = `Question Prompt: "${qPrompt.replace(/"/g, '""')}"\n`;
            csv += `Correct Answer Key: ${correctAns}\n\n`;
            csv += `Roll/Index,Student Name,Scanned Response,Is Correct\n`;

            roster.forEach((name, idx) => {
                const choice = responses[name] || 'N/A';
                const isCorrect = choice === correctAns ? 'YES' : (choice === 'N/A' ? 'NOT SCANNED' : 'NO');
                csv += `${idx + 1},"${name}",${choice},${isCorrect}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Class_MCQ_Results_${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
        }
    </script>
</body>
</html>
